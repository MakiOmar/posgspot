# Production compose — POS + Accounts + Qwik storefront on gamesspoteg.com (behind Cloudflare)
# Deploy to: /opt/spot-staging on the VPS (never commit real .env secrets)
# Hosts come from the compose .env: SHOP_DOMAIN, POS_DOMAIN, ACCOUNTS_DOMAIN.
# HTTP → HTTPS is an entrypoint redirect in traefik/traefik.yml; routers below are HTTPS only.

name: spot-staging

networks:
  spot_edge:
    name: spot_edge
  spot_internal:
    name: spot_internal

volumes:
  mysql_data:
  redis_data:
  traefik_letsencrypt:

services:
  traefik:
    # v3.3 Docker client is too old for Docker Engine 29+ (min API 1.40)
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Cloudflare DNS-01 challenge (token scoped to Zone DNS Edit on the shop zone)
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?Set CF_DNS_API_TOKEN in /opt/spot-staging/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - spot_edge

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - spot_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - spot_internal

  pos:
    image: spot-staging/pos:latest
    build:
      context: ./pos
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./pos/.env
    # PHP-FPM capacity (serversideup/php). Default max_children=20 saturates under k6 stress.
    # On 4-core VPS: ~40 children; scale replicas with: docker compose up -d --scale pos=2
    environment:
      PHP_FPM_PM_CONTROL: dynamic
      PHP_FPM_PM_MAX_CHILDREN: "40"
      PHP_FPM_PM_START_SERVERS: "8"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "4"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "12"
      PHP_MEMORY_LIMIT: 256M
      PHP_OPCACHE_ENABLE: "1"
    volumes:
      - ./pos/.env:/var/www/html/.env:ro
      - ./data/pos_storage:/var/www/html/storage
      - ./data/pos_uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - spot_edge
      - spot_internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=spot_edge
      - traefik.http.routers.pos.rule=Host(`${POS_DOMAIN:-pos.gamesspoteg.com}`)
      - traefik.http.routers.pos.entrypoints=websecure
      - traefik.http.routers.pos.tls=true
      - traefik.http.routers.pos.tls.certresolver=le
      - traefik.http.services.pos.loadbalancer.server.port=8080

  pos-queue:
    image: spot-staging/pos:latest
    restart: unless-stopped
    entrypoint:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--max-time=3600",
      ]
    # Workers have no nginx; the image's default HTTP healthcheck (port 8080) always fails here
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 30s
    env_file:
      - ./pos/.env
    volumes:
      - ./pos/.env:/var/www/html/.env:ro
      - ./data/pos_storage:/var/www/html/storage
      - ./data/pos_uploads:/var/www/html/public/uploads
    depends_on:
      - pos
      - mysql
    networks:
      - spot_internal

  pos-scheduler:
    image: spot-staging/pos:latest
    restart: unless-stopped
    entrypoint: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 30s
    env_file:
      - ./pos/.env
    volumes:
      - ./pos/.env:/var/www/html/.env:ro
      - ./data/pos_storage:/var/www/html/storage
      - ./data/pos_uploads:/var/www/html/public/uploads
    depends_on:
      - pos
      - mysql
    networks:
      - spot_internal

  accounts:
    image: spot-staging/accounts:latest
    build:
      context: ./accounts
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./accounts/.env
    volumes: &accounts_volumes
      - ./accounts/.env:/var/www/html/.env:ro
      - ./data/accounts_storage:/var/www/html/storage
      # Manager uploads (gitignored) must survive image rebuilds
      - ./data/accounts_assets/uploads:/var/www/html/public/assets/uploads
      - ./data/accounts_assets/ps4:/var/www/html/public/assets/ps4
      - ./data/accounts_assets/ps5:/var/www/html/public/assets/ps5
      - ./data/accounts_logos:/var/www/html/public/logos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - spot_edge
      - spot_internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=spot_edge
      - traefik.http.routers.accounts.rule=Host(`${ACCOUNTS_DOMAIN:-accounts.gamesspoteg.com}`)
      - traefik.http.routers.accounts.entrypoints=websecure
      - traefik.http.routers.accounts.tls=true
      - traefik.http.routers.accounts.tls.certresolver=le
      - traefik.http.services.accounts.loadbalancer.server.port=8080

  accounts-queue:
    image: spot-staging/accounts:latest
    restart: unless-stopped
    entrypoint: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 30s
    env_file:
      - ./accounts/.env
    volumes: *accounts_volumes
    depends_on:
      - accounts
      - mysql
    networks:
      - spot_internal

  storefront:
    build:
      # Built from the POS git checkout (npm ci + npm run build inside Docker)
      context: ./pos/storefront-qwik
      dockerfile: ../../storefront/Dockerfile
    restart: unless-stopped
    environment:
      ORIGIN: https://${SHOP_DOMAIN:-gamesspoteg.com}
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - pos
    networks:
      - spot_edge
      - spot_internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=spot_edge
      - traefik.http.routers.shop.rule=Host(`${SHOP_DOMAIN:-gamesspoteg.com}`)
      - traefik.http.routers.shop.entrypoints=websecure
      - traefik.http.routers.shop.tls=true
      - traefik.http.routers.shop.tls.certresolver=le
      - traefik.http.services.shop.loadbalancer.server.port=3000
      - traefik.http.routers.shop-www.rule=Host(`www.${SHOP_DOMAIN:-gamesspoteg.com}`)
      - traefik.http.routers.shop-www.entrypoints=websecure
      - traefik.http.routers.shop-www.tls=true
      - traefik.http.routers.shop-www.tls.certresolver=le
      # www → apex, domain-agnostic
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https?://www[.]([^/]+)/(.*)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://$${1}/$${2}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.routers.shop-www.middlewares=www-to-apex
      - traefik.http.routers.shop-www.service=shop
      # Old shop host (new.<domain>) → apex, so bookmarks and in-flight payment returns keep working
      - traefik.http.routers.shop-legacy.rule=Host(`new.${SHOP_DOMAIN:-gamesspoteg.com}`)
      - traefik.http.routers.shop-legacy.entrypoints=websecure
      - traefik.http.routers.shop-legacy.tls=true
      - traefik.http.routers.shop-legacy.tls.certresolver=le
      - traefik.http.middlewares.legacy-to-apex.redirectregex.regex=^https?://new[.]([^/]+)/(.*)
      - traefik.http.middlewares.legacy-to-apex.redirectregex.replacement=https://$${1}/$${2}
      - traefik.http.middlewares.legacy-to-apex.redirectregex.permanent=true
      - traefik.http.routers.shop-legacy.middlewares=legacy-to-apex
      - traefik.http.routers.shop-legacy.service=shop
