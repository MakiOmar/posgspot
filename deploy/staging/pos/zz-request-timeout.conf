; Wall-clock cap per web request. AppServiceProvider calls set_time_limit(0), and max_execution_time
; ignores time spent waiting on MySQL, so without this a runaway request keeps a DB transaction open
; for hours after nginx has already returned 504. CLI workers and the scheduler are not affected.
[${PHP_FPM_POOL_NAME}]
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}
