# Traefik static config — production edge behind Cloudflare (proxied records, SSL Full (strict))
api:
  dashboard: false

# trustedIPs = Cloudflare edge ranges (https://www.cloudflare.com/ips/). Only these may set
# X-Forwarded-*; any other peer gets its headers replaced with the real address.
entryPoints:
  web:
    address: ":80"
    # Redirect every HTTP request at the edge so it never depends on a container's labels
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      trustedIPs: &cloudflare_ips
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs: *cloudflare_ips

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: spot_edge
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      email: admin@gamesspoteg.com
      storage: /letsencrypt/acme.json
      # DNS-01 works while records are proxied and before traffic moves; token via CF_DNS_API_TOKEN
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  level: INFO
